services:
  qcms-caliper-be:
    container_name: qcms-caliper-be
    build: .
    image: qcms-caliper-be
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
    ports:
      - '${PORT:-8085}:${PORT:-8085}'
    networks:
      - app-network
    volumes:
      # volume untuk Baileys WA
      - ./baileys_auth_info:/app/baileys_auth_info

networks:
  app-network:
    driver: bridge
