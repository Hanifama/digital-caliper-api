version: '3.9'

services:
  qcms-caliper-be:
    container_name: qcms-caliper-be
    build: .
    image: qcms-caliper-be
    env_file:
      - .env
    ports:
      - '${PORT:-8085}:${PORT:-8085}'
    networks:
      - app-network
    volumes:
      # biar WA session tetap nyala setelah rebuild
      - ./wwebjs_auth:/app/.wwebjs_auth
      - ./wwebjs_cache:/app/.wwebjs_cache

networks:
  app-network:
    driver: bridge
